const saved=JSON.parse(localStorage.getItem('andrew-demo')||'{}');let tracked=new Set(saved.tracked||[]);let completed=new Set(saved.completed||[]),read=new Set(saved.read||[]),urls=saved.urls||{},filter='All',query='',font=new URLSearchParams(location.search).get('font')||'Inter';if(saved.extra)tasks.push(...saved.extra);document.body.style.setProperty('--font',`'${font}'`);function persist(){localStorage.setItem('andrew-demo',JSON.stringify({tracked:[...tracked],completed:[...completed],read:[...read],urls,font,extra:tasks.filter(t=>t.id>=100)}))}const c=id=>courses.find(x=>x.id===id);const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const dot=id=>`<span class="dot" style="--c:${c(id).color}"></span>`;const sorted=a=>a.sort((x,y)=>x.due.localeCompare(y.due));const match=t=>`${t.title} ${t.course} ${c(t.course).name}`.toLowerCase().includes(query.toLowerCase());const time=t=>new Date(t.due).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});const date=t=>new Date(t.due).toLocaleDateString('en-US',{month:'short',day:'numeric'});function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3000)}

function today(){let all=sorted(tasks.filter(t=>match(t)&&!completed.has(t.id))),now=all.filter(t=>t.due.startsWith(compactDays?selectedDay:'2026-10-29')),tomorrow=all.filter(t=>t.due.startsWith('2026-10-30')),todayPosts=posts.filter(p=>p.date==='Oct 29'&&match(p)),following=posts.filter(p=>tracked.has(p.id)&&match(p));return header(`<em>${all.filter(t=>t.due.startsWith('2026-10-29')).length}</em> due today`,'Your next two days, at a glance.','THURSDAY, OCTOBER 29 · REFERENCE PREVIEW')+`<div class="today-grid"><section class="today-tasks">${compactDays?dayScroller():''}<div class="section-head"><h2>${compactDays&&selectedDay!=='2026-10-29'?new Date(selectedDay+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}):'Today'}</h2><span class="count">${compactDays?selectedDay.slice(5).replace('-',' / '):'THU, OCT 29'} · ${now.length} TASKS</span></div>${now.map(taskRow).join('')||'<div class="empty">All done for today.</div>'}${compactDays&&selectedDay!=='2026-10-29'?'':`<div class="later"><div class="section-head"><h2>Tomorrow</h2><span class="count">FRI, OCT 30 · ${tomorrow.length} TASKS</span></div>${tomorrow.map(taskRow).join('')||'<div class="empty">Nothing due tomorrow.</div>'}</div>`}</section><aside class="today-announcement-stack"><section class="announcements"><div class="section-head"><h2>Today’s announcements</h2><span class="badge">${todayPosts.length} TODAY</span></div>${todayPosts.map(postRow).join('')||'<div class="announcement-empty"><span>All quiet today.</span><p>No announcements posted today.</p></div>'}<button class="text-btn" data-page="announcements">View all announcements ↗</button></section><section class="announcements following-announcements"><div class="section-head"><h2>Following</h2><span class="count">${following.length} ${following.length===1?'CONVERSATION':'CONVERSATIONS'}</span></div>${following.map(postRow).join('')||'<div class="announcement-empty"><span>Keep an eye on the conversation.</span><p>Track a con iv><article class="post-reading"><div class="post-byline"><span class="course-chip">${dot(p.course)} ${p.course}</span><span>${p.source} · ${p.date}, 2026${p.id===0?' · Instructor answered':''}</span></div><h2>${esc(p.title)}</h2><div class="summary-card"><div class="summary-label"><span>AI</span> SUMMARY</div><p>${esc(p.body)}</p></div><div class="original-label">ORIGINAL POST</div><p class="original-post">${esc(original)}</p>${p.id===0?'<div class="instructor-answer"><strong>Instructor answer</strong><p>Yes, that’s fair game. Review the 4.3 practice problems.</p></div>':''}<p class="summary-disclaimer">Summaries are AI-generated and may miss details.</p>${tracked.has(p.id)?'<p class="tracking-note">Tracking locally · live reply checks not connected</p>':''}</article>`:'<div class="empty">Select an announcement to read.</div>'}</section></div>`}
function assignmentGroups(ts){const groups=[...new Set(ts.map(t=>t.due.slice(0,10)))];return groups.map(day=>{const label=day==='2026-10-29'?'Today':day==='2026-10-30'?'Tomorrow':new Date(day+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});const items=ts.filter(t=>t.due.startsWith(day));return `<section class="todo-group"><div class="section-head"><h2>${label}</h2><span class="count">${items.filter(t=>completed.has(t.id)).length} / ${items.length} COMPLETE</span></div>${items.map(t=>`<div class="todo-row ${completed.has(t.id)?'is-complete':''}"><button class="check ${completed.has(t.id)?'done':''}" data-complete="${t.id}" aria-label="${completed.has(t.id)?'Mark incomplete':'Complete'} ${esc(t.title)}">${completed.has(t.id)?'✓':''}</button><button class="todo-title" data-task="${t.id}"><strong>${esc(t.title)}</strong><span>${dot(t.course)} ${t.course} · ${c(t.course).name}</span></button><span class="todo-source">${t.source}</span><span class="todo-time ${day==='2026-10-29'?'due-today':''}">${time(t)}</span><button class="todo-open" data-task="${t.id}" aria-label="View ${esc(t.title)} details">↗</button></div>`).join('')}</section>`}).join('')}

function render(){let page=location.hash.slice(1)||'today';navigation(page);let html;if(page==='today')html=today();else if(page==='assignments'||c(page))html=assignmentPage(c(page)?page:null);else if(page==='announcements')html=announcementSplit();else html=header('Your week','October 26 – November 1, 2026','A LITTLE PERSPECTIVE')+`<div class="weekgrid">${['Mon 26','Tue 27','Wed 28','Thu 29','Fri 30','Sat 31','Sun 1'].map((d,i)=>`<div class="weekcol"><div class="section-head"><h2>${d}</h2></div>${tasks.filter(t=>t.due.startsWith(i===6?'2026-11-01':`2026-10-${26+i}`)&&match(t)).map(taskRow).join('')||'<p style="font-size:10px">Nothing due</p>'}</div>`).join('')}</div>`;$('#main').classList.toggle('announcements-page',page==='announcements');$('#main').innerHTML=html}
function drawer(item,type){if(type==='post'){openAnnouncement(item);return}const assignment=type==='task',key=type+item.id;if(!assignment){read.add(item.id);persist();render()}$('#drawer-root').innerHTML=`<div class="scrim" data-close></div><aside class="drawer ${assignment?'':'left'}" role="dialog" aria-modal="true" aria-label="${assignment?'Assignment':'Announcement'} details"><button class="drawer-close" data-close aria-label="Close details">×</button><div class="eyebrow">${assignment?'ASSIGNMENT DETAILS':'CLASS ANNOUNCEMENT'}</div><h2>${esc(item.title)}</h2><div class="task-meta">${dot(item.course)} ${item.course} · ${c(item.course).name}</div><div class="detail-data"><div><small>${assignment?'DUE DATE':'POSTED'}</small>${assignment?date(item)+' · '+time(item):item.date+', 2026'}</div><div><small>SOURCE</small>${item.source}</div></div><div class="eyebrow">${assignment?'ABOUT THIS ASSIGNMENT':'POST DETAILS'}</div><div class="body">${esc(item.body)}</div><p class="hint">Preview content based on the supplied design. Check the original for complete instructions.</p>${assignment?`<button class="btn primary" data-drawer-complete="${item.id}">${completed.has(item.id)?'Mark incomplete':'✓ Mark complete'}</button>`:''}<div><a class="btn" href="${esc(item.url||sourceHome(item.source))}" target="_blank" rel="noopener">${item.url?'Open original assignment':'Open '+item.source} ↗</a></div></aside>`;$('.drawer-close').focus()}
function addTask(){const m=$('#modal');m.innerHTML=`<form id="task-form"><h2>Add to your collection</h2><label>Assignment title</label><input name="title" required placeholder="What’s on your list?"><label>Class</label><select name="course">${courses.map(co=>`<option>${co.id}</option>`).join('')}</select><label>Due</label><input name="due" type="datetime-local" required value="2026-10-30T23:59"><div class="actions"><button type="button" class="btn" data-modal-close>Cancel</button><button class="btn primary">Add task</button></div></form>`;m.showModal();$('#task-form').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),id=Date.now();tasks.push({id,title:d.get('title'),course:d.get('course'),due:d.get('due'),source:'Personal',body:'A task you added to your collection.'});persist();m.close();render();toast('Task added to your collection')}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-task],[data-post],[data-complete],[data-close],[data-add],[data-fetch],[data-filter],[data-modal-close],[data-drawer-complete],[data-day],[data-compact-day],[data-day-shift],[data-collapse-post],[data-track],[data-toggle-unread],[data-post-task]');if(!b)return;if(b.hasAttribute('data-complete')){e.stopPropagation();let id=+b.dataset.complete;completed.has(id)?completed.delete(id):completed.add(id);persist();render()}else if(b.dataset.page){filter='All';location.hash=b.dataset.page}else if(b.dataset.task)drawer(tasks.find(t=>t.id===+b.dataset.task),'task');else if(b.hasAttribute('data-toggle-unread')){let id=+b.dataset.toggleUnread;read.has(id)?read.delete(id):read.add(id);persist();render()}else if(b.hasAttribute('data-post-task')){let post=posts.find(p=>p.id===+b.dataset.postTask);tasks.push({id:Date.now(),title:post.title,course:post.course,due:'2026-10-30T23:59',source:post.source,body:post.body,url:post.url});persist();render();toast('Added to your to-do list for tomorrow')}else if(b.hasAttribute('data-track')){let id=+b.dataset.track;tracked.has(id)?tracked.delete(id):tracked.add(id);persist();render()}else if(b.hasAttribute('data-collapse-post')){expandedPost=null;render()}else if(b.hasAttribute('data-compact-day')){selectedDay=b.dataset.compactDay;render()}else if(b.hasAttribute('data-day-shift')){dayOffset+=Number(b.dataset.dayShift);render()}else if(b.dataset.post)drawer(posts.find(p=>p.id===+b.dataset.post),'post');else if(b.hasAttribute('data-close'))$('#drawer-root').innerHTML='';else if(b.hasAttribute('data-fetch')){toast('Preview only — live course syncing is not connected.');}else if(b.hasAttribute('data-add'))addTask();else if(b.hasAttribute('data-filter')){filter=b.dataset.filter;render()}else if(b.hasAttribute('data-modal-close'))$('#modal').close();else if(b.dataset.drawerComplete){let id=+b.dataset.drawerComplete;completed.has(id)?completed.delete(id):completed.add(id);persist();render();drawer(tasks.find(t=>t.id===id),'task')}else if(b.hasAttribute('data-day')){location.hash='week'}});$('#settings').onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme();};$('#search').oninput=e=>{query=e.target.value;render()};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#drawer-root').innerHTML='';if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('#search').focus()}if(e.key==='Enter'&&e.target.matches('[data-task],[data-post]'))e.target.click()});window.onhashchange=()=>{filter='All';$('#drawer-root').innerHTML='';render();window.scrollTo(0,0)};render();

function fitDesktop(){const scale=Math.min(1,window.innerWidth/1200);document.body.style.zoom=scale;document.querySelector("#sidebar").style.height=(window.innerHeight/scale)+"px"}window.addEventListener("resize",fitDesktop);fitDesktop();
</script></body></html>
